# A4P 에이전트 상황판 — jeffarese/herdr-agent-grid v2.1.0(MIT)을 고친 판.
# 바꾼 것: 위쪽 색 탭(1~5), 카드 색을 herdr-attention 분류로(빨강 입력 필요·노랑 확인 안 함·초록 확인함·파랑 작업 중), 한국어 표시.
# 버전 뒤 -a4p.N: 원본 릴리스 실행 파일을 잘못 내려받지 않게 (cargo가 있으면 소스에서 빌드)
id = "a4p-agent-grid"
name = "A4P 에이전트 상황판"
version = "2.1.0-a4p.1"
min_herdr_version = "0.9.0"
description = "모든 에이전트를 카드로 한눈에: 입력 필요(빨강)·확인 안 함(노랑)·확인함(초록)·작업 중(파랑) 탭"
platforms = ["linux", "macos", "windows"]

# Herdr resolves "./" programs against the plugin root on every platform
# (Windows appends .exe), so actions and panes run the native binary directly.
[[build]]
platforms = ["linux", "macos"]
command = ["sh", "install.sh", "--prepare-only"]

[[build]]
platforms = ["windows"]
command = ["powershell.exe", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "install.ps1", "--prepare-only"]

[[actions]]
id = "open"
title = "에이전트 상황판 열기"
description = "모든 에이전트의 상태를 카드로 보고, 고른 칸으로 바로 간다"
contexts = ["global"]
command = ["./bin/herdr-agent-grid", "open"]

# Let the manifest select popup: some Herdr builds support it in the server
# and manifest, but do not expose it in the CLI --placement enum.
[[panes]]
id = "grid"
title = "에이전트 상황판"
description = "에이전트마다 상태 카드 한 장"
placement = "popup"
width = "100%"
height = "100%"
command = ["./bin/herdr-agent-grid"]
